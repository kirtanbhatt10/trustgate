[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate-scan"
version = "0.2.0"
description = "See everything a repository will run when you open, install or build it: IDE tasks, AI agent hooks, npm lifecycle scripts, dev containers and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kirtan Bhatt" }]
keywords = ["security", "supply-chain", "vscode", "claude-code", "cursor", "mcp", "devcontainer", "npm", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/trustgate"
Issues = "https://github.com/kirtanbhatt10/trustgate/issues"
Changelog = "https://github.com/kirtanbhatt10/trustgate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kirtanbhatt10/trustgate/blob/main/docs/rules.md"

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.setuptools]
packages = ["trustgate", "trustgate.checks"]
