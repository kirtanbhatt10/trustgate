name: Bug report
description: trustgate crashed, hung, printed something wrong or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way to make trustgate execute repository content, skip files or hide findings?
        Please report it privately instead: https://github.com/kirtanbhatt10/trustgate/security/advisories/new
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `trustgate --version` and `python --version`, plus your OS.
      placeholder: trustgate 0.2.0, Python 3.12.4, macOS 15
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Files that reproduce it
      description: The smallest set of files (paths and contents) and the exact command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
